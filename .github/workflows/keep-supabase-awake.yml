name: Keep Supabase awake

# Failsafe for the Vercel cron in vercel.json (/api/admin/cron/keepalive).
# Both fire daily; either one alone keeps the free-tier project from pausing
# after 7 days of inactivity. The route runs SELECT 1 against Postgres.
# Named so RepoDeck lists it under Keep Alive.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KEEPALIVE_URL: https://support.developerofcode.com/api/admin/cron/keepalive
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET secret is not set." >&2
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${KEEPALIVE_URL}" -w "\nHTTP %{http_code}\n"
