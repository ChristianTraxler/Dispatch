name: Deploy to Vercel

# Fallback for when Vercel cannot pull the repo from GitHub itself. On
# 2026-08-24 Vercel's stored GitHub credential started returning
# 401 "Bad credentials", so every git-triggered build failed with
# "the git provider returned a server error" and the deploy hook produced
# queued jobs that never became deployments.
#
# This uploads the source directly and lets VERCEL build it. Two details are
# load-bearing, both learned the hard way that day:
#
#   1. Do NOT use `vercel build` + `--prebuilt`. Uploading a locally- or
#      CI-built artifact deployed successfully but produced a site that
#      500'd on every database-backed page (PrismaClientInitializationError).
#      Vercel's own builder handles Prisma correctly. Upload source, let them
#      build it. This took production down twice before the cause was found.
#   2. `.git` is deleted before deploying. Vercel blocks deployments carrying
#      commit metadata it cannot match to a GitHub account ("the commit email
#      ... could not be matched"). No .git means nothing to reject. The
#      checkout is disposable, so this is safe.
#
# This does NOT replace .github/workflows/vercel-deploy.yml — that deploy-hook
# workflow is deliberately kept as belt-and-suspenders.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard — VERCEL_TOKEN must be set
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add a TEAM-scoped (All Projects) token — a project-scoped one resolves no user and fails with 'User not found'."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Strip git metadata before deploying
        # Vercel rejects deployments carrying unmatched commit metadata.
        run: rm -rf .git

      - name: Deploy to production (built by Vercel, not here)
        run: |
          vercel deploy --prod --yes \
            --project dispatch \
            --scope developer-of-code-llcs-projects \
            --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify production is actually healthy
        # A green deploy is not proof the site works — both outages on
        # 2026-08-24 came from a "successful" deploy serving 500s.
        run: |
          sleep 20
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://support.developerofcode.com/portal)
          echo "GET /portal -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Production is unhealthy after deploy (/portal returned $CODE). Roll back in the Vercel dashboard."
            exit 1
          fi
          echo "Production healthy."
